<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SynthAudit system architecture</title>
  <desc id="desc">Four source adapters normalize into canonical reaction and route models, feed transactional execution and independent evidence lanes, then produce CLI, Streamlit, HTML, and JSON outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.boundary{fill:#fff;stroke:#cbd5e1;stroke-width:2}.core{fill:#eaf0f7;stroke:#1e3a5f;stroke-width:2}.evidence{fill:#ecfdf5;stroke:#16803c;stroke-width:2}.unavailable{fill:#fff7ed;stroke:#b45309;stroke-width:2;stroke-dasharray:7 5}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:500 14px system-ui,sans-serif;fill:#334155}.section{font:700 14px ui-monospace,monospace;fill:#1e3a5f;letter-spacing:1px}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="label" x="54" y="48">SynthAudit · representation-agnostic audit architecture</text>
  <text class="small" x="54" y="75">Stable atom maps · separated stages · explicit missing evidence · offline core</text>

  <text class="section" x="54" y="124">SOURCE BOUNDARIES</text>
  <rect class="boundary" x="54" y="144" width="200" height="62" rx="10"/><text class="label" x="76" y="180">Mapped reaction</text>
  <rect class="boundary" x="54" y="222" width="200" height="62" rx="10"/><text class="label" x="76" y="258">ReactSeq</text>
  <rect class="unavailable" x="54" y="300" width="200" height="78" rx="10"/><text class="label" x="76" y="332">SynthEx draft</text><text class="small" x="76" y="357">official schema unavailable</text>
  <rect class="boundary" x="54" y="394" width="200" height="62" rx="10"/><text class="label" x="76" y="430">Synthelite route</text>

  <rect class="core" x="314" y="208" width="218" height="170" rx="14"/>
  <text class="section" x="338" y="242">NORMALIZATION</text>
  <text class="label" x="338" y="278">Fail-closed adapters</text>
  <text class="small" x="338" y="307">Warnings + provenance</text>
  <text class="small" x="338" y="332">Unsupported semantics</text>
  <text class="small" x="338" y="357">No silent mapping or repair</text>

  <rect class="core" x="594" y="144" width="252" height="116" rx="14"/>
  <text class="section" x="618" y="179">CANONICAL MODELS</text>
  <text class="label" x="618" y="214">ReactionIR · RouteIR</text>
  <text class="small" x="618" y="239">Versioned JSON Schemas</text>
  <rect class="core" x="594" y="292" width="252" height="164" rx="14"/>
  <text class="section" x="618" y="326">TRANSACTIONAL EXECUTION</text>
  <text class="small" x="618" y="358">Product → reaction centre</text>
  <text class="small" x="618" y="384">Synthons → completion</text>
  <text class="small" x="618" y="410">Precursors → stereo</text>
  <text class="small" x="618" y="436">Rollback + RDKit diagnostics</text>

  <text class="section" x="914" y="124">INDEPENDENT EVIDENCE</text>
  <rect class="evidence" x="914" y="144" width="290" height="62" rx="10"/><text class="label" x="938" y="180">Stage-specific audits</text>
  <rect class="evidence" x="914" y="222" width="290" height="62" rx="10"/><text class="label" x="938" y="258">Multi-view novelty</text>
  <rect class="evidence" x="914" y="300" width="290" height="62" rx="10"/><text class="label" x="938" y="336">Precedent retrieval</text>
  <rect class="evidence" x="914" y="378" width="290" height="78" rx="10"/><text class="label" x="938" y="410">Evidence support</text><text class="small" x="938" y="436">uncertainty + abstention</text>

  <rect class="boundary" x="314" y="536" width="890" height="116" rx="14"/>
  <text class="section" x="338" y="572">PRODUCT SURFACES</text>
  <text class="label" x="338" y="610">Typer CLI</text><text class="label" x="528" y="610">Five-page Streamlit</text><text class="label" x="790" y="610">Standalone HTML</text><text class="label" x="1035" y="610">JSON</text>
  <text class="small" x="338" y="637">All outputs retain provenance, unavailable states, limitations, and the scientific notice.</text>

  <path class="edge" d="M254 175H314"/><path class="edge" d="M254 253H314"/><path class="edge" d="M254 339H314"/><path class="edge" d="M254 425H314"/>
  <path class="edge" d="M532 274H594"/><path class="edge" d="M720 260V292"/>
  <path class="edge" d="M846 202H914"/><path class="edge" d="M846 343H914"/><path class="edge" d="M846 375H886V253H914"/><path class="edge" d="M846 407H914"/>
  <path class="edge" d="M1058 456V536"/><path class="edge" d="M720 456V536"/>
</svg>
