name: codex-source-export

on:
  push:
    branches:
      - codex/direct-use-v1-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf /tmp/synthaudit-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: synthaudit-source-${{ github.sha }}
          path: /tmp/synthaudit-source.tar.gz
          if-no-files-found: error
          retention-days: 1
