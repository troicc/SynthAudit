name: complete-direct-use-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-direct-use-main
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - name: Apply the final direct-use fixes and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          easy_path = Path("src/synthaudit/easy.py")
          text = easy_path.read_text(encoding="utf-8")
          if "import hashlib\n" not in text:
              text = text.replace(
                  "import csv\nimport importlib.util\nimport json\n",
                  "import csv\nimport hashlib\nimport importlib.util\nimport json\nimport re\n",
                  1,
              )
          if "def _safe_record_key(" not in text:
              anchor = "def _record_iterator(\n"
              helper = '''def _safe_record_key(identifier: str) -> str:
              """Return a deterministic directory name that cannot escape the output root."""

              original = identifier.strip()
              digest = hashlib.sha256(original.encode("utf-8")).hexdigest()[:10]
              readable = re.sub(r"[^A-Za-z0-9._-]+", "-", original).strip("._-")
              readable = readable[:80] or "record"
              return f"{readable}-{digest}"


              '''
              if anchor not in text:
                  raise SystemExit("record iterator anchor not found")
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(
              '        record_dir = output_dir / "records" / identifier\n',
              '        record_dir = output_dir / "records" / _safe_record_key(identifier)\n',
              1,
          )
          easy_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_easy.py")
          tests = test_path.read_text(encoding="utf-8")
          if "    _safe_record_key,\n" not in tests:
              tests = tests.replace(
                  "from synthaudit.easy import (\n    _record_iterator,\n",
                  "from synthaudit.easy import (\n    _record_iterator,\n    _safe_record_key,\n",
                  1,
              )
          tests = tests.replace(
              '''    assert list(
              _record_iterator(csv_path, reaction_column="reaction_smiles", id_column="reaction_id")
          )[0][0] == "a"
          ''',
              '''    assert next(
              _record_iterator(csv_path, reaction_column="reaction_smiles", id_column="reaction_id")
          )[0] == "a"
          ''',
          )
          tests = tests.replace(
              '''    assert list(
              _record_iterator(jsonl_path, reaction_column="reaction_smiles", id_column="reaction_id")
          )[0][0] == "b"
          ''',
              '''    assert next(
              _record_iterator(jsonl_path, reaction_column="reaction_smiles", id_column="reaction_id")
          )[0] == "b"
          ''',
          )
          if "def test_batch_record_key_is_path_safe_and_deterministic" not in tests:
              tests += '''

          def test_batch_record_key_is_path_safe_and_deterministic() -> None:
              first = _safe_record_key("../../unsafe / reaction")
              second = _safe_record_key("../../unsafe / reaction")
              other = _safe_record_key("another reaction")
              assert first == second
              assert first != other
              assert "/" not in first
              assert "\\\\" not in first
              assert ".." not in first
          '''
          test_path.write_text(tests, encoding="utf-8")

          Path("docs/DIRECT_USE_VALIDATION.md").write_text(
              '''# Direct-use validation record

The direct-use interface was merged into the default `main` branch and then checked in a clean
GitHub Actions Ubuntu environment with Python 3.11.

The validation pass runs:

- frozen dependency installation from `uv.lock`;
- Ruff linting and formatting checks;
- strict mypy checks;
- the offline test suite;
- `synthaudit-easy doctor`;
- a complete mapped-reaction direct-use smoke test that produces JSON and HTML output.

The separate package, reproducibility, and Docker workflows remain the authoritative checks for
wheel/sdist installation, deterministic fixture reproduction, and container startup.

The following documents are present on the default branch:

- `docs/BEGINNER_GUIDE_ZH.md`;
- `docs/DIRECT_USE.md`;
- `docs/DIRECT_USE_VALIDATION.md`.

This record verifies software operation and file publication. It does not establish experimental
feasibility, yield, selectivity, safety, scalability, or chemistry-model performance.
''',
              encoding="utf-8",
          )

          for path in (
              ".github/workflows/harden-direct-use.yml",
              ".github/workflows/finalize-direct-use.yml",
              ".github/workflows/publish-direct-use.yml",
          ):
              Path(path).unlink(missing_ok=True)
          PY
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check --fix src/synthaudit/easy.py tests/unit/test_easy.py
      - run: uv run ruff format src/synthaudit/easy.py tests/unit/test_easy.py
      - run: make quality
      - run: make test
      - run: make doctor
      - run: make easy-smoke
      - name: Commit the verified final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: finalize direct-use publication and documentation"
            git push origin HEAD:main
          fi
