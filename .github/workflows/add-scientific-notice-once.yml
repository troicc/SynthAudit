name: add-scientific-notice-once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - name: Add the exact scientific notice to all direct-use documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          notice = (
              "SynthAudit estimates representation validity, corpus novelty and evidence-based "
              "plausibility. It does not establish experimental feasibility, yield, selectivity, "
              "safety or scalability."
          )
          paths = (
              Path("docs/BEGINNER_GUIDE_ZH.md"),
              Path("docs/DIRECT_USE.md"),
              Path("docs/DIRECT_USE_VALIDATION.md"),
              Path("docs/DIRECT_USE_CHANGELOG.md"),
              Path("docs/CODESPACES_AND_OLD_MAC.md"),
              Path("docs/OPTIONAL_INTEGRATIONS.md"),
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if notice in text:
                  continue
              lines = text.splitlines()
              if not lines or not lines[0].startswith("#"):
                  raise SystemExit(f"missing Markdown heading: {path}")
              repaired = "\n".join([lines[0], "", f"> {notice}", "", *lines[1:]]).lstrip("\n")
              path.write_text(repaired.rstrip() + "\n", encoding="utf-8")
          Path(".github/workflows/add-scientific-notice-once.yml").unlink()
          PY
      - run: uv sync --frozen --all-extras --dev
      - run: make quality
      - run: make test
      - run: make doctor
      - run: make easy-smoke
      - run: uv build
      - name: Verify the wheel in a clean Python 3.11 environment
        run: |
          rm -rf /tmp/synthaudit-wheel
          uv venv --python 3.11 /tmp/synthaudit-wheel
          uv pip install --python /tmp/synthaudit-wheel/bin/python dist/*.whl
          /tmp/synthaudit-wheel/bin/synthaudit version --json
          /tmp/synthaudit-wheel/bin/synthaudit-easy doctor --json
      - name: Commit the repaired and verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: restore scientific notices in direct-use guides"
          git push origin HEAD:main
