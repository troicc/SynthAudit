name: format-direct-use-once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff format src/synthaudit/easy.py src/synthaudit/integrations/reactionclassifier.py tests/unit/test_easy.py
      - run: uv run ruff check src/synthaudit/easy.py src/synthaudit/integrations/reactionclassifier.py tests/unit/test_easy.py
      - run: rm .github/workflows/format-direct-use-once.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format merged direct-use files"
          git push origin HEAD:main
