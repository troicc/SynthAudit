name: finalize-direct-use

on:
  push:
    branches:
      - codex/direct-use-v1-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/direct-use-v1-1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - name: Fix clean-wheel validation and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/package.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          python3 -m venv /tmp/synthaudit-wheel
          /tmp/synthaudit-wheel/bin/pip install dist/*.whl
          /tmp/synthaudit-wheel/bin/synthaudit version --json
          /tmp/synthaudit-wheel/bin/synthaudit-easy doctor --json
'''
          new = '''          uv venv --python 3.11 /tmp/synthaudit-wheel
          uv pip install --python /tmp/synthaudit-wheel/bin/python dist/*.whl
          /tmp/synthaudit-wheel/bin/synthaudit version --json
          /tmp/synthaudit-wheel/bin/synthaudit-easy doctor --json
'''
          if old not in text:
              raise SystemExit('expected package workflow block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/codex-source-export.yml
          rm -f .github/workflows/finalize-direct-use.yml
      - run: uv sync --frozen --all-extras --dev
      - run: make quality
      - run: make test
      - run: make doctor
      - run: make easy-smoke
      - name: Commit finalized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize direct-use branch"
          git push origin HEAD:codex/direct-use-v1-1
