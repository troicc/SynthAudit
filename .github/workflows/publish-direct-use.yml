name: publish-direct-use

on:
  push:
    branches:
      - codex/direct-use-v1-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/direct-use-v1-1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - name: Make package validation idempotently use Python 3.11
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/package.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          python3 -m venv /tmp/synthaudit-wheel
          /tmp/synthaudit-wheel/bin/pip install dist/*.whl
'''
          new = '''          uv venv --python 3.11 /tmp/synthaudit-wheel
          uv pip install --python /tmp/synthaudit-wheel/bin/python dist/*.whl
'''
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - run: make reproduce-small
      - run: uv build
      - name: Verify the built wheel in a clean Python 3.11 environment
        run: |
          rm -rf /tmp/synthaudit-wheel
          uv venv --python 3.11 /tmp/synthaudit-wheel
          uv pip install --python /tmp/synthaudit-wheel/bin/python dist/*.whl
          /tmp/synthaudit-wheel/bin/synthaudit version --json
          /tmp/synthaudit-wheel/bin/synthaudit-easy doctor --json
      - name: Verify Docker runtime
        run: |
          docker build -t synthaudit:direct-use .
          docker run --rm synthaudit:direct-use synthaudit version --json
          docker run --rm synthaudit:direct-use synthaudit-easy doctor --json
      - name: Write validation record and remove one-shot workflows
        run: |
          cat > docs/DIRECT_USE_VALIDATION.md <<'EOF'
          # Direct-use validation record

          The direct-use release was validated on GitHub Actions Ubuntu with Python 3.11 before
          publication to `main`.

          Completed gates:

          - `uv lock --check`;
          - frozen installation with all declared extras and development dependencies;
          - `make reproduce-small`;
          - source distribution and wheel build;
          - clean Python 3.11 wheel installation;
          - `synthaudit version --json` and `synthaudit-easy doctor --json` from the wheel;
          - Docker image build and runtime smoke for both command-line entry points.

          This record verifies software operation. It does not add a chemistry-performance,
          experimental-feasibility, yield, selectivity, safety, or scalability claim.
          EOF
          rm -f .github/workflows/codex-source-export.yml
          rm -f .github/workflows/finalize-direct-use.yml
          rm -f .github/workflows/publish-direct-use.yml
      - name: Publish the validated tree
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: publish directly usable SynthAudit workflows"
          git push origin HEAD:codex/direct-use-v1-1
          git push origin HEAD:main
