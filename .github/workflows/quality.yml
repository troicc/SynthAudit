name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - run: make quality
      - run: make test
      - run: make smoke
      - run: make doctor
      - run: make easy-smoke
